name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y mpv ffmpeg yt-dlp nodejs libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --release
      - name: Integration selftests
        run: |
          ./target/release/human-gita --selftest-units
          ./target/release/human-gita --selftest-features