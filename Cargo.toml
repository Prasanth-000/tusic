[package]
name = "kalki"
version = "0.1.0"
edition = "2021"
description = "KALKI — premium blue terminal music player (Rust + ratatui + mpv)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
lofty = "0.22"
notify-rust = "4"
toml = "0.8"
unicode-width = "0.2"
anyhow = "1"
dirs = "5"
dbus-crossroads = "0.5.3"
dbus = "0.9.12"
